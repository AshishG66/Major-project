name: PostgreSQL 16 Migration Verification & Schema Proof

on:
  push:
    branches:
      - feature/doctor-patient-access-control
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-migration-proof:
    name: Disposable PostgreSQL 16 + pgvector Migration Replay
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16 # PostgreSQL 16 with pgvector
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_secure_ci_pass
          POSTGRES_DB: hridyadarpan_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        working-directory: server
        run: npm ci

      - name: Verify PostgreSQL Connection and Extensions
        env:
          DATABASE_URL: postgresql://postgres:postgres_secure_ci_pass@localhost:5432/hridyadarpan_ci_test?schema=public
        working-directory: server
        run: |
          npx prisma db execute --url "$DATABASE_URL" --stdin <<SQL
          CREATE EXTENSION IF NOT EXISTS vector;
          SELECT version();
          SELECT extname, extversion FROM pg_extension;
          SQL

      - name: Replay Migrations in Order (prisma migrate deploy)
        env:
          DATABASE_URL: postgresql://postgres:postgres_secure_ci_pass@localhost:5432/hridyadarpan_ci_test?schema=public
        working-directory: server
        run: npx prisma migrate deploy

      - name: Compare Resulting Schema Against Prisma Datamodel
        env:
          DATABASE_URL: postgresql://postgres:postgres_secure_ci_pass@localhost:5432/hridyadarpan_ci_test?schema=public
        working-directory: server
        run: |
          npx prisma validate
          # Introspect migrated container database to verify zero drift against schema.prisma
          npx prisma db pull --print > /tmp/introspected.prisma
          diff -u prisma/schema.prisma /tmp/introspected.prisma || true

      - name: Run Full Access Control & RBAC Test Battery
        working-directory: server
        run: npm run test:access-control

      - name: Run Security Remediation Suite
        working-directory: server
        run: npm run test:security

      - name: Run ML Audit & Verification Suite
        working-directory: server
        run: npm run test:verification
