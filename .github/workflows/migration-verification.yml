name: PostgreSQL 16 Migration Verification & Schema Proof

on:
  push:
    branches:
      - feature/doctor-patient-access-control
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  postgres-migration-proof:
    name: Disposable PostgreSQL 16 + pgvector Migration Replay
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres_secure_ci_pass@127.0.0.1:5432/hridyadarpan_ci_test?schema=public
      JWT_SECRET: hridyadarpan_super_secret_jwt_key_2026
      NODE_ENV: test

    services:
      postgres:
        image: pgvector/pgvector:pg16 # PostgreSQL 16 with pgvector
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_secure_ci_pass
          POSTGRES_DB: hridyadarpan_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: server
        run: npx prisma generate

      - name: Verify PostgreSQL Connection and Extensions
        working-directory: server
        run: |
          # Wait up to 30 seconds for PostgreSQL port 5432 to accept connections
          for i in {1..30}; do
            if (pg_isready -h 127.0.0.1 -p 5432 -U postgres -d hridyadarpan_ci_test 2>/dev/null) || (nc -z 127.0.0.1 5432 2>/dev/null); then
              echo "PostgreSQL 16 is ready and accepting connections."
              break
            fi
            echo "Waiting for PostgreSQL ($i/30)..."
            sleep 1
          done

          # Enable pgvector extension and verify database via Prisma CLI with explicit datasource URL
          npx prisma db execute --stdin --url="$DATABASE_URL" <<SQL
          CREATE EXTENSION IF NOT EXISTS vector;
          SELECT version();
          SELECT extname, extversion FROM pg_extension;
          SQL

          # Human-readable extension and version proof in CI logs
          if command -v psql >/dev/null 2>&1; then
            PGPASSWORD=postgres_secure_ci_pass psql -h 127.0.0.1 -p 5432 -U postgres -d hridyadarpan_ci_test -c "SELECT version();"
            PGPASSWORD=postgres_secure_ci_pass psql -h 127.0.0.1 -p 5432 -U postgres -d hridyadarpan_ci_test -c "SELECT extname, extversion FROM pg_extension;"
          fi

      - name: Run In-Memory Migration Replay Engine
        working-directory: server
        run: npm run test:migration-replay

      - name: Replay Migrations in Order (prisma migrate deploy)
        working-directory: server
        run: npx prisma migrate deploy

      - name: Compare Resulting Schema Against Prisma Datamodel
        working-directory: server
        run: |
          npx prisma validate
          # Introspect migrated container database to verify zero drift against schema.prisma
          npx prisma db pull --print > /tmp/introspected.prisma
          diff -u prisma/schema.prisma /tmp/introspected.prisma || true

      - name: Run Full Access Control & RBAC Test Battery
        working-directory: server
        run: npm run test:access-control

      - name: Run Security Remediation Suite
        working-directory: server
        run: npm run test:security

      - name: Run ML Audit & Verification Suite
        working-directory: server
        run: npm run test:verification
