version: '3.8'

services:
  # Caddy Reverse Proxy with Automatic HTTPS (Let's Encrypt) & WebSockets
  caddy:
    image: caddy:2.7-alpine
    container_name: hridayadarpana-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${PUBLIC_DOMAIN:-api.yourdomain.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  # FastAPI ML Microservice (5 Production Models)
  ai-service:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: hridayadarpana-ai
    restart: always
    environment:
      - PORT=8000
      - MODELS_DIR=models
    expose:
      - "8000"

  # Express Production Gateway
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hridayadarpana-backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - AI_SERVICE_URL=http://ai-service:8000
    expose:
      - "5000"
    depends_on:
      - ai-service

volumes:
  caddy_data:
  caddy_config:
